[project]
name = "docker-practise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohin", email = "rohin.kotagiri@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.3.5",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.70.0",
]

[project.scripts]
docker-practise = "docker_practise:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.6.0",
]
